# DeFiScope AI - full stack for shared demos.
# Local single-developer setup does NOT need Docker; see README "Quick start".

services:
  db:
    # pgvector-enabled Postgres so the chat (roadmap #8) can store embeddings in
    # a native `vector` column. Same wire protocol/driver as postgres:16.
    # Built locally on postgres:16-alpine + source-compiled pgvector: Docker
    # Scout reports 4C/31H vs the third-party pgvector/pgvector:pg16 (Debian
    # base) at 9C/46H. See services/db/Dockerfile for the why/how.
    build: ./services/db
    image: defiscope-db:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: defiscope
      POSTGRES_PASSWORD: defiscope
      POSTGRES_DB: defiscope
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defiscope"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # The 4th container (alongside db, api, web): a disposable response cache for
    # the catalog list/facet reads (Stage 3 perf). Built from ./services/redis so
    # it ships a cache-tuned redis.conf (bounded maxmemory + allkeys-lru eviction,
    # AOF) instead of Redis's stock `noeviction`/unbounded defaults. Strictly
    # optional: if this is down or DEFISCOPE_REDIS_URL is unset the API simply
    # serves every catalog read straight from Postgres - the cache is a speedup,
    # never a dependency, and Postgres stays the source of truth. No host port is
    # published: only the API, on the internal compose network, talks to it.
    build: ./services/redis
    image: defiscope-redis:latest
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: ./services/api
    restart: unless-stopped
    environment:
      DEFISCOPE_DATABASE_URL: postgresql+psycopg://defiscope:defiscope@db:5432/defiscope
      # Optional Redis catalog cache. Blank it (DEFISCOPE_REDIS_URL= in .env) to
      # run fully uncached without removing the redis service.
      DEFISCOPE_REDIS_URL: ${DEFISCOPE_REDIS_URL:-redis://redis:6379/0}
      DEFISCOPE_DEFAULT_PROTOCOLS: aave-v3,uniswap-v3,lido,curve-dex,compound-v3
      # Market-wide risk watchlist. The board/alerts cover the top N protocols by
      # TVL (after category/slug exclusions); the crawl is spread across passes
      # via the refresh batch so one tick stays inside the interval. Override in
      # .env to shrink the demo footprint (e.g. DEFISCOPE_MARKET_TOP_N=200).
      DEFISCOPE_MARKET_TOP_N: ${DEFISCOPE_MARKET_TOP_N:-5000}
      DEFISCOPE_MONITOR_REFRESH_BATCH_SIZE: ${DEFISCOPE_MONITOR_REFRESH_BATCH_SIZE:-600}
      DEFISCOPE_MONITOR_ALWAYS_CURATED: ${DEFISCOPE_MONITOR_ALWAYS_CURATED:-true}
      DEFISCOPE_MONITOR_INTERVAL_MINUTES: ${DEFISCOPE_MONITOR_INTERVAL_MINUTES:-2}
      DEFISCOPE_BOARD_PREVIEW_SIZE: ${DEFISCOPE_BOARD_PREVIEW_SIZE:-120}
      # Enrichment master switches. When a provider host is unreachable or
      # rate-limiting (e.g. fees.llama.fi DNS-blocked), a market-wide crawl
      # spends its time in retry/backoff on those calls and starves the request
      # loop, flipping readiness unhealthy. Flip these to false in .env to
      # degrade to TVL-only (the feature's documented escape hatch). Defaults
      # keep full enrichment.
      DEFISCOPE_ECONOMIC_DATA_ENABLED: ${DEFISCOPE_ECONOMIC_DATA_ENABLED:-true}
      DEFISCOPE_STABLECOIN_DATA_ENABLED: ${DEFISCOPE_STABLECOIN_DATA_ENABLED:-true}
      # Bound the cold-start pre-seed storm: `false` seeds only the top TVL slice
      # (above preseed_min_tvl) instead of backfilling the whole market tail on
      # boot, so a first board is useful fast without a many-minute crawl. With
      # the 2-min cadence a full-market backfill on boot overlaps the first
      # scheduled passes and starves the DB pool (readiness -> unhealthy -> web
      # blocked), so the bounded cold start is the default here. Override to
      # true in .env to backfill the entire tail up front.
      DEFISCOPE_PRESEED_BACKFILL_REST: ${DEFISCOPE_PRESEED_BACKFILL_REST:-false}
      # Second data provider (on-chain activity). Both default to empty, which is
      # a supported state: the API then reports `unconfigured` for every protocol
      # and spends no Dune credits. Set them in .env to switch it on.
      DEFISCOPE_DUNE_API_KEY: ${DEFISCOPE_DUNE_API_KEY:-}
      DEFISCOPE_DUNE_ACTIVITY_QUERY_ID: ${DEFISCOPE_DUNE_ACTIVITY_QUERY_ID:-}
      # Authorization mode: off | demo | required. Compose pins `demo` so the
      # seeded accounts exist and the role switcher works — the default for a
      # bare `docker run` is `required`, which seeds nothing and would look
      # broken here.
      DEFISCOPE_AUTH_MODE: ${DEFISCOPE_AUTH_MODE:-demo}
      DEFISCOPE_AUTH_DEMO_PASSWORD: ${DEFISCOPE_AUTH_DEMO_PASSWORD:-defiscope-demo}
      # Optional: wire a model API key through from your shell
      DEFISCOPE_OPENAI_API_KEY: ${DEFISCOPE_OPENAI_API_KEY:-}
      # Point chat generation + embeddings at any OpenAI-compatible server.
      # Defaults to OpenAI; run with `--profile llm` (Ollama) and set these in
      # .env to go fully local. NOTE for Ollama/LocalAI: our code enables the
      # LLM path only when a key is SET, so pass any non-empty value for
      # DEFISCOPE_OPENAI_API_KEY (the local server ignores the token itself).
      DEFISCOPE_OPENAI_BASE_URL: ${DEFISCOPE_OPENAI_BASE_URL:-https://api.openai.com/v1}
      DEFISCOPE_OPENAI_MODEL: ${DEFISCOPE_OPENAI_MODEL:-gpt-4o-mini}
      DEFISCOPE_OPENAI_EMBEDDING_MODEL: ${DEFISCOPE_OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      # Answer style: higher temp + a generous token budget = fuller, engaging
      # prose (still forced by the system prompt to cite [n] and admit gaps).
      DEFISCOPE_RAG_TEMPERATURE: ${DEFISCOPE_RAG_TEMPERATURE:-0.5}
      DEFISCOPE_RAG_MAX_TOKENS: ${DEFISCOPE_RAG_MAX_TOKENS:-1600}
      # Local CPU models are slow; keep the generation timeout generous so long
      # answers aren't needlessly degraded to the extractive fallback.
      DEFISCOPE_RAG_LLM_TIMEOUT_SECONDS: ${DEFISCOPE_RAG_LLM_TIMEOUT_SECONDS:-150}
      # Conversation memory: replay the last N turns (each capped) so the analyst
      # holds the thread and answers follow-ups like a person.
      DEFISCOPE_RAG_MAX_HISTORY_TURNS: ${DEFISCOPE_RAG_MAX_HISTORY_TURNS:-6}
      DEFISCOPE_RAG_HISTORY_CHAR_LIMIT: ${DEFISCOPE_RAG_HISTORY_CHAR_LIMIT:-700}
      # Relevance bar for the offline BM25 path: how many distinct informative
      # query terms a passage must share to count as supporting (not just one
      # stray common word). Raise to tighten, lower to be more permissive.
      DEFISCOPE_RAG_MIN_QUERY_TERM_OVERLAP: ${DEFISCOPE_RAG_MIN_QUERY_TERM_OVERLAP:-2}
      # Chat RAG: read the methodology/architecture docs (mounted read-only
      # below) so grounded answers can cite them, not just live protocol data.
      DEFISCOPE_RAG_DOCS_DIR: /app/docs
    volumes:
      # Ship the repo docs into the container for chat ingestion without
      # rebuilding the image (read-only; the app never writes here).
      - ./docs:/app/docs:ro
    ports:
      - "3646:8000"
    # Image defines a HEALTHCHECK on /api/health/ready; wait for it to pass.
    # The readiness probe opens a pooled DB connection (SELECT 1). On a cold
    # start the app immediately fires the warm-up / pre-seed / catalog / ingest
    # background tasks, which saturate the pool with slow DefiLlama fetches and
    # bulk snapshot writes - so the probe can briefly fail to obtain a
    # connection. Give a generous start_period (the pre-seed storm observed on a
    # cold volume runs >130s) and more retries so a transient pool-contention
    # blip never flips the container unhealthy and stalls the web dependency.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request as u; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=8).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      # No health gate needed: the cache is optional and the app degrades on a
      # Redis outage, so a slow/failed redis must not block API startup.
      redis:
        condition: service_started

  web:
    build:
      context: ./apps/web
      args:
        # Baked at image build; use the internal service URL so the web
        # container's server-side fetches resolve the API over the compose network.
        NEXT_PUBLIC_API_URL: http://api:8000
        # Browser-facing URL for the docs link. `api:8000` is unreachable from
        # the host browser, so point it at the API's published host port (3646).
        NEXT_PUBLIC_API_PUBLIC_URL: http://localhost:3646
        # Browser-reachable WebSocket base for streamed chat tokens. The browser
        # opens the socket directly (Next can't reliably proxy WS), so this must
        # be the host-published address, not the internal `api:8000`.
        NEXT_PUBLIC_API_WS_URL: ws://localhost:3646
        # Baked: the login page's one-click demo buttons. Off in a real build.
        NEXT_PUBLIC_AUTH_DEMO: "1"
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
      NEXT_PUBLIC_API_PUBLIC_URL: http://localhost:3646
      NEXT_PUBLIC_API_WS_URL: ws://localhost:3646
      # Read at request time by proxy.ts (the UX redirect) and lib/auth.ts.
      # Keep it in step with the API's DEFISCOPE_AUTH_MODE; if they disagree the
      # redirect and the enforcement just disagree, harmlessly — the API always
      # has the final word. NEXT_PUBLIC_AUTH_DEMO is baked at build, hence the
      # matching build arg above.
      DEFISCOPE_AUTH_MODE: ${DEFISCOPE_AUTH_MODE:-demo}
      NEXT_PUBLIC_AUTH_DEMO: "1"
      NEXT_PUBLIC_AUTH_DEMO_PASSWORD: ${DEFISCOPE_AUTH_DEMO_PASSWORD:-defiscope-demo}
    ports:
      - "4000:3000"
    depends_on:
      api:
        condition: service_healthy

  # --- Optional local LLM (start with: docker compose --profile llm up -d) ----
  # Free, self-hosted chat generation for "Ask the analyst". NOTHING above
  # depends on these: with no key/server the app already degrades to the offline
  # BM25 + extractive path, so the shipped default stays lean. To enable:
  #   1) docker compose --profile llm up -d
  #   2) docker compose exec ollama ollama pull qwen2.5:7b-instruct
  #   3) in .env:  DEFISCOPE_OPENAI_API_KEY=ollama
  #               DEFISCOPE_OPENAI_BASE_URL=http://ollama:11434/v1
  #               DEFISCOPE_OPENAI_MODEL=qwen2.5:7b-instruct
  # (the API key value is ignored by Ollama but our code requires one to be set)
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    restart: unless-stopped
    # Publish on an overridable host port: the api container reaches Ollama over
    # the compose network at http://ollama:11434 regardless, so this mapping only
    # exposes it to the host/browser. Default stays 11434; set OLLAMA_PUBLISH_PORT
    # in .env when a host Ollama already holds that port (e.g. 11435).
    ports:
      - "${OLLAMA_PUBLISH_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Free model runs CPU-only inside the Docker Desktop VM, which caps all
      # containers at a few GB. Keep exactly one model resident, hold it warm
      # between chats (a cold reload costs tens of seconds), and cap the context
      # so generation stays light. open-webui competes for the same budget -
      # start it only when you actually need the dev console.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-2048}

  # Internal developer console ONLY (talks straight to Ollama for prompt/model
  # tuning). It is NOT the customer-facing chat - our grounded dashboard stays.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    profiles: ["llm"]
    restart: unless-stopped
    ports:
      - "3002:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      - ollama

volumes:
  pgdata:
  redis_data:
  ollama_data:
  open_webui_data:
