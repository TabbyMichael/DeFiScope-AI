# DeFiScope AI - Redis configuration for the protocol catalog cache (Stage 3).
#
# This instance holds ONLY disposable, regenerable catalog pages and facets:
# Postgres is the source of truth, and every value here can be recomputed from
# the database at any time. The settings therefore prioritise "never harm the
# host, never fake data" over durability.

# --- Persistence: warm pages across a restart, but cheap ----------------------
# Append-only file keeps cached pages after a container restart so the first
# reads after a bounce still hit the cache. Losing them would cost nothing but a
# recompute, so we use the cheap `everysec` fsync (at most ~1s of cached pages at
# risk) rather than `always`, which would slow every write for durability we do
# not need.
appendonly yes
appendfsync everysec

# --- Memory: a bounded cache, never an OOM risk -------------------------------
# A hard ceiling so a full catalog cache can never balloon into the host's
# memory. Sized well above the handful of hot Explorer/Compare pages and facets
# actually used; tune up for a bigger deployment. Raise/replace freely - Redis
# contents are disposable.
maxmemory 256mb

# When the ceiling is reached, evict the least-recently-used key. This is the
# correct policy for a pure cache: every key is regenerable, so any page may be
# dropped under pressure. It replaces Redis's default `noeviction`, which would
# instead refuse new writes (and, with no maxmemory, grow without bound).
maxmemory-policy allkeys-lru

# Free evicted/expired values in a background thread so dropping a large catalog
# page does not stall the single-threaded event loop and add latency to reads.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes

# --- Cache-only posture -------------------------------------------------------
# Nothing here is a source of truth, so RDB snapshotting is pointless disk churn
# on top of AOF: disable the periodic save and rely on AOF alone.
save ""

# No bind/protected-mode tweaks: redis is reachable only on the internal compose
# network (no host port is published for it), and the app treats it as optional -
# a missing or unreachable redis degrades catalog reads to Postgres, never a 500.
