[project]
name = "defiscope-api"
version = "0.1.0"
description = "DeFiScope AI - DeFi research, risk scoring and monitoring backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "apscheduler>=3.10",
    "python-dateutil>=2.9",
    "alembic>=1.20.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "aiodns",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
# ruff-format already wraps code at line-length; the remaining long lines are
# human-readable prose/string literals and comments that must not be broken.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately assert on exact string bodies and use dict literals.
"tests/*" = ["B011"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection helpers are meant to be called in argument
# defaults; treat them as immutable calls rather than B008 violations.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
]
