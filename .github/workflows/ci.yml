name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Test (pytest)
        run: uv run pytest

      - name: OpenAPI schema drift check
        # Regenerate openapi.json from the code and fail if the committed
        # artifact is out of date (frontend types are generated from it).
        # Path is relative to the job's working-directory (services/api).
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code openapi.json

  web:
    name: Web (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generated types drift check
        # Regenerate lib/api-types.ts from the committed OpenAPI schema and fail
        # on any diff (types must be codegen, never hand-edited).
        run: npm run check:types

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  e2e:
    name: Web (Playwright e2e)
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Bring up the full stack
        # Build the hardened images and start db + api + web. Compose waits on
        # the api healthcheck (and web on api), so the board is reachable.
        run: docker compose up -d --build

      - name: Run e2e tests
        env:
          E2E_BASE_URL: http://localhost:4000
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 5

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
